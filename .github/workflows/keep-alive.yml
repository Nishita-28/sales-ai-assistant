name: Keep Streamlit app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 30 https://mnst-ai-sales-assistant.streamlit.app/ || true
